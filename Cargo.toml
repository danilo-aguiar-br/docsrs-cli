[package]
name = "docsrs-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One-shot stdin/stdout CLI for crates.io and docs.rs documentation for LLM agents"
license = "MIT"
readme = "README.md"
keywords = ["docs", "crates", "cli", "rustdoc", "llm"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/docsrs-cli/docsrs-cli"
authors = ["docsrs-cli contributors"]

[[bin]]
name = "docsrs-cli"
path = "src/main.rs"

[lib]
name = "docsrs_cli"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
clap = { version = "4", features = ["derive", "env", "cargo", "wrap_help"] }
clap_complete = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
sys-locale = "0.3"
toml = "0.8"
url = "2"
scraper = "0.22"
htmd = "0.5"
bytes = "1"
futures-util = "0.3"
regex = "1"
once_cell = "1"
sha2 = "0.10"

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
